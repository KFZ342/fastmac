name: fastmac
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  shell:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start tmate
        run: |
          brew install tmate
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' > /tmp/tmate_ssh.txt
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}' > /tmp/tmate_web.txt
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b tmate-info
          cp /tmp/tmate_ssh.txt ./ssh.txt
          cp /tmp/tmate_web.txt ./web.txt
          git add ssh.txt web.txt
          git commit -m "tmate info"
          git push origin tmate-info --force
